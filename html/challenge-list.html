<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>챌린지</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/utility.css" />
    <link rel="stylesheet" href="../css/challenge-list.css" />
  </head>

  <body>
    <main>
      <!-- 상단 -->
      <header class="challenge-header">
        <h1>챌린지</h1>
      </header>

      <!-- 챌린지 상태 -->
      <div class="challenge-tabs">
        <button type="button" class="tab-button active" data-status="ongoing">
          진행 중
        </button>

        <button type="button" class="tab-button" data-status="completed">
          완료
        </button>
      </div>

      <!-- 챌린지 목록 -->
      <section class="challenge-list"></section>

      <!-- 초대코드 참여 -->
      <section class="invite-section">
        <div class="invite-header">
          <div>
            <h2>초대코드로 참여하기</h2>

            <p>친구에게 받은 초대코드를 입력해주세요.</p>
          </div>
        </div>

        <div class="invite-input-box">
          <input
            type="text"
            id="invite-code"
            class="invite-code-input"
            placeholder="초대코드 입력"
            maxlength="12"
            autocomplete="off"
          />

          <button
            type="button"
            id="invite-check-button"
            class="invite-check-button"
          >
            확인
          </button>
        </div>

        <p id="invite-message" class="invite-message"></p>

        <!-- 초대코드 확인 후 표시 -->
        <div id="join-challenge-box" class="join-challenge-box hidden">
          <!-- 참여할 챌린지 정보 -->
          <div class="join-challenge-info">
            <span class="join-category"></span>

            <h3 id="join-challenge-title"></h3>

            <p id="join-challenge-period"></p>
          </div>

          <!-- 개인 목표 설정 -->
          <div class="personal-goal-box">
            <label for="personal-goal">나의 목표</label>

            <p>
              같은 주제로 도전하지만 목표는 나에게 맞게 설정할 수 있어요.
            </p>

            <div class="goal-input-box">
              <input
                type="number"
                id="personal-goal"
                class="personal-goal-input"
                placeholder="목표 입력"
                min="0"
                step="0.1"
              />

              <span id="goal-unit" class="goal-unit"></span>
            </div>
          </div>

          <!-- 참여 버튼 -->
          <button
            type="button"
            id="join-challenge-button"
            class="join-challenge-button"
          >
            챌린지 참여하기
          </button>
        </div>
      </section>

      <!-- 새 챌린지 만들기 -->
      <button
        type="button"
        class="create-challenge"
        onclick="location.href = 'challenge-create.html'"
      >
        <span>＋</span>
        새 챌린지 만들기
      </button>

      <!-- 하단 메뉴 -->
      <nav class="bottom-nav">
        <!-- 홈 -->
        <a href="../index.html">
          <img src="../icons/bottom-home.svg" alt="홈" />
          <span>홈</span>
        </a>

        <!-- 챌린지 -->
        <a href="challenge-list.html" class="active">
          <img src="../icons/bottom-trophy.svg" alt="챌린지" />
          <span>챌린지</span>
        </a>

        <!-- 기록 -->
        <a href="challenge-record.html">
          <img src="../icons/bottom-record.svg" alt="기록" />
          <span>기록</span>
        </a>

        <!-- 분석 -->
        <a href="analysis.html">
          <img src="../icons/bottom-chart.svg" alt="분석" />
          <span>분석</span>
        </a>

        <!-- 마이 -->
        <a href="my-page.html">
          <img src="../icons/bottom-user.svg" alt="마이" />
          <span>마이</span>
        </a>
      </nav>
    </main>

    <script src="../scripts/challenge-list.js"></script>
  </body>
</html>
