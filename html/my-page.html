<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>마이페이지</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="../css/my-page.css" />
  </head>

  <body>
    <main>
      <!-- 상단 -->
      <header class="header">
        <div class="header-title">
          <h1>마이페이지</h1>

          <p>내 정보와 활동을 관리해요.</p>
        </div>

        <div class="header-logo">HabitMate</div>
      </header>

      <!-- 프로필 -->
      <section class="profile">
        <div class="profile-info">
          <div class="profile-image">성</div>

          <div class="profile-text">
            <h2>연성</h2>

            <p>yeonsung@gmail.com</p>

            <button type="button" class="edit-button">
              프로필 수정
            </button>
          </div>
        </div>

        <!-- 챌린지 통계 -->
        <div class="statistics">
          <div class="statistic-item">
            <p>총 참여 챌린지</p>

            <strong>
              5<span>개</span>
            </strong>

            <small>&nbsp;</small>
          </div>

          <div class="statistic-item">
            <p>완료한 챌린지</p>

            <strong>
              2<span>개</span>
            </strong>

            <small>&nbsp;</small>
          </div>

          <div class="statistic-item">
            <p>완주율</p>

            <strong class="highlight">
              40<span>%</span>
            </strong>

            <small>&nbsp;</small>
          </div>

          <div class="statistic-item">
            <p>연속 성공</p>

            <strong class="highlight">
              12<span>일</span>
            </strong>

            <small>최고 20일</small>
          </div>
        </div>
      </section>

      <!-- 설정 -->
      <section class="setting">
        <button type="button" class="setting-item">
          <span>프로필 수정</span>

          <strong>&gt;</strong>
        </button>

        <button type="button" class="setting-item">
          <span>비밀번호 변경</span>

          <strong>&gt;</strong>
        </button>

        <button type="button" class="setting-item">
          <span>알림 설정</span>

          <strong>&gt;</strong>
        </button>

        <button type="button" class="setting-item logout">
          <span>로그아웃</span>

          <strong>&gt;</strong>
        </button>
      </section>

      <!-- 하단 메뉴 -->
      <nav class="bottom-nav">
        <a href="../index.html">
          <img src="../icons/bottom-home.svg" alt="홈" />
          <span>홈</span>
        </a>

        <a href="challenge-list.html">
          <img src="../icons/bottom-trophy.svg" alt="챌린지" />
          <span>챌린지</span>
        </a>

        <a href="challenge-record.html">
          <img src="../icons/bottom-record.svg" alt="기록" />
          <span>기록</span>
        </a>

        <a href="analysis.html">
          <img src="../icons/bottom-chart.svg" alt="분석" />
          <span>분석</span>
        </a>

        <a href="my-page.html" class="active">
          <img src="../icons/bottom-user.svg" alt="마이" />
          <span>마이</span>
        </a>
      </nav>
    </main>

    <script src="../scripts/my-page.js"></script>
  </body>
</html>
