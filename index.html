<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HabitMate</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main>
      <header
  class="header display-flex justify-content-space-between align-items-center"
>
  <h1>HabitMate</h1>
</header>

      <!-- 메인 상단 -->
      <section class="top-content">
        <div class="top-card display-flex align-items-center">
          <!-- 메인 캐릭터 -->
          <section class="intro display-flex align-items-center">
            <div class="intro-character">
              <img src="./images/main.mascot.png" alt="HabitMate mascot" />
            </div>

            <div class="speech-bubble">
              <p>
                <img class="speech-leaf" src="./icons/leaf.png" alt="" />
                나에게 맞는 건강 습관을<br />
                꾸준히 이어가보세요!
              </p>
            </div>
          </section>

          <!-- 기록 현황 -->
          <section
            class="record-status display-flex justify-content-space-around align-items-center"
          >
            <!-- 연속 기록 -->
            <div class="record-item display-flex align-items-center">
              <div class="record-icon">
                <img src="./icons/streak.png" alt="연속 기록" />
              </div>

              <div class="record-text">
                <p>연속 기록</p>

                <strong> <span class="streak-count">0</span>일 </strong>

                <span>최고 0일</span>
              </div>
            </div>

            <!-- 이번 주 달성률 -->
            <div class="record-item display-flex align-items-center">
              <div class="record-icon">
                <img src="./icons/target.png" alt="이번 주 달성률" />
              </div>

              <div class="record-text">
                <p>이번 주 달성률</p>

                <strong class="week-percent">0%</strong>

                <span>목표 0/0</span>

                <div class="week-progress">
                  <div class="week-progress-bar"></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <!-- 오늘 목표 -->
      <section class="goal">
        <div
          class="goal-header display-flex justify-content-space-between align-items-center"
        >
          <h2>
            오늘 목표
            <img class="goal-title-icon" src="./icons/check.png" alt="" />
          </h2>

          <div class="goal-header-right">
            <p>
              오늘 달성률
              <strong class="goal-percent">0%</strong>
            </p>
          </div>
        </div>

        <!-- 목표 진행률 -->
        <div class="goal-progress">
          <div class="goal-progress-bar"></div>
        </div>

        <!-- 오늘 목표 목록 -->
        <div class="goal-list"></div>
      </section>

      <!-- 함께하는 챌린지 -->
      <section class="group">
        <div
          class="group-header display-flex justify-content-space-between align-items-center"
        >
          <h2>함께하는 챌린지</h2>

          <p>
            오늘 인증
            <strong>3 / 4명</strong>
          </p>
        </div>

        <div class="group-list display-flex justify-content-space-around">
          <!-- 첫 번째 멤버 -->
          <div class="group-member">
            <div class="member-profile">김</div>
            <p>김다혜</p>
            <strong class="member-complete">인증 완료</strong>
          </div>

          <!-- 나 -->
          <div class="group-member me">
            <div class="member-profile">나</div>
            <p>나</p>
            <strong class="member-wait">인증 전</strong>
          </div>

          <!-- 세 번째 멤버 -->
          <div class="group-member">
            <div class="member-profile">이</div>
            <p>이지은</p>
            <strong class="member-complete">인증 완료</strong>
          </div>

          <!-- 네 번째 멤버 -->
          <div class="group-member">
            <div class="member-profile">박</div>
            <p>박서연</p>
            <strong class="member-complete">인증 완료</strong>
          </div>
        </div>
      </section>

      <!-- 진행 중인 챌린지 -->
      <section class="challenge">
        <div
          class="challenge-section display-flex justify-content-space-between align-items-center"
        >
          <h2>진행 중인 챌린지</h2>
          <a href="./html/challenge-list.html">전체 보기 &gt;</a>
        </div>

        <!-- 진행 중 챌린지가 JS로 들어오는 곳 -->
        <div class="challenge-list display-flex"></div>
      </section>

      <!-- 오늘 요약 -->
      <section
        class="summary display-flex justify-content-space-between align-items-center"
      >
        <div class="summary-icon">↗</div>

        <div class="summary-text">
          <p class="summary-count">오늘 목표 0개 중 0개 완료했어요!</p>

          <p class="summary-message">오늘의 목표를 확인해보세요!</p>
        </div>

        <a href="./html/challenge-record.html" class="record-button">
          기록하기
        </a>
      </section>

      <!-- 하단 메뉴 -->
      <nav
        class="bottom-nav display-flex justify-content-space-around align-items-center"
      >
        <a href="./index.html" class="active">
          <img src="./icons/bottom-home.svg" alt="홈" />
          <span>홈</span>
        </a>

        <a href="./html/challenge-list.html">
          <img src="./icons/bottom-trophy.svg" alt="챌린지" />
          <span>챌린지</span>
        </a>

        <a href="./html/challenge-record.html">
          <img src="./icons/bottom-record.svg" alt="기록" />
          <span>기록</span>
        </a>

        <a href="./html/analysis.html">
          <img src="./icons/bottom-chart.svg" alt="분석" />
          <span>분석</span>
        </a>

        <a href="./html/my-page.html">
          <img src="./icons/bottom-user.svg" alt="마이" />
          <span>마이</span>
        </a>
      </nav>
    </main>

    <script src="./scripts/script.js"></script>
  </body>
</html>
